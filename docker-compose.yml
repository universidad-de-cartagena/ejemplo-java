version: '3.4'

services:
  app:
    image: ejemplo-java:latest
    build: .
    ports:
      - "8080:8080"
  database:
    image: docker.io/mariadb:10.4
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=backend_java
    volumes:
      - database:/var/lib/mysql

volumes:
  database:
