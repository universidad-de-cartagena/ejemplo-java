apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../k8s
  - ../../base

namePrefix: dev-

namespace: ejemplo-java

patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: ejemplo-java
  - path: resource-limits.yaml
    target:
      kind: Deployment
      name: ejemplo-java

configMapGenerator:
  - name: ejemplo-java-env
    behavior: create
    literals:
      - ENVIRONMENT=dev
      - DEBUG=true
      - LOG_LEVEL=debug
      - JAVA_OPTS=-Xmx128m -Xms128m

generatorOptions:
  disableNameSuffixHash: true
