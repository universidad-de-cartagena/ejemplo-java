apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../k8s
  - ../../base

namePrefix: staging-

namespace: ejemplo-java

patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: ejemplo-java
  - path: resource-limits.yaml
    target:
      kind: Deployment
      name: ejemplo-java

configMapGenerator:
  - name: ejemplo-java-env
    behavior: create
    literals:
      - ENVIRONMENT=staging
      - DEBUG=false
      - LOG_LEVEL=info
      - JAVA_OPTS=-Xmx256m -Xms256m

generatorOptions:
  disableNameSuffixHash: true
