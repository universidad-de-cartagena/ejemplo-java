apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../k8s
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

namePrefix: prod-

namespace: ejemplo-java

patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: ejemplo-java
  - path: resource-limits.yaml
    target:
      kind: Deployment
      name: ejemplo-java

configMapGenerator:
  - name: ejemplo-java-env
    behavior: create
    literals:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=warn
      - JAVA_OPTS=-Xmx512m -Xms512m

generatorOptions:
  disableNameSuffixHash: true
