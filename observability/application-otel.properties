# OpenTelemetry configuration for Quarkus application
# Add to application.properties or set via environment variables

# Quarkus OTel extension configuration
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.tracer.enabled=true
quarkus.opentelemetry.exporter.otlp.endpoint=http://otel-collector:4317

# Resource attributes (OpenTelemetry semantic conventions)
quarkus.opentelemetry.resource.attributes.service.name=ejemplo-java
quarkus.opentelemetry.resource.attributes.service.version=1.0.0
quarkus.opentelemetry.resource.attributes.service.namespace=ejemplo-java
quarkus.opentelemetry.resource.attributes.deployment.environment=development

# JDBC instrumentation
quarkus.hibernate-orm.telemetry.enabled=true

# Health and metrics
quarkus.smallrye-health.enabled=true
